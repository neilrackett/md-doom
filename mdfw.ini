; mdfw.ini - MD/DOOM built for EmuMD (mdfw build), to run in Hatari.
; https://github.com/neilrackett/emumd; paths are relative to this file.

[firmware]
name = MD/DOOM
version = v0.7.1
output = build/md-doom.mdfw

[sources]
; The firmware's logic and the engine, as rp/src/CMakeLists.txt lists
; them. Left out: main.c (clocks, SELECT, the jump to the Booster;
; emu/mdfw_app.c does the rest of it), romemul, commemul, sdcard,
; hw_config, select (PIO, DMA, SPI, GPIO), reset.c and fb_chunked.c
; (emu/ has versions a host can run), and the test card.
files =
    emu/*.c
    rp/src/*.c
    rp/src/settings/settings.c
    rp/src/doom/*.c
    rp/src/doom/*.cpp
    rp/src/doom/doom/*.c
    rp/src/doom/md/*.c
exclude =
    rp/src/main.c
    rp/src/romemul.c
    rp/src/commemul.c
    rp/src/sdcard.c
    rp/src/hw_config.c
    rp/src/select.c
    rp/src/reset.c
    rp/src/fb_chunked.c
    rp/src/doomapp.c

[compile]
shims =
    emu/shim
include =
    rp/src/ff
    rp/src/doom/md
    rp/src/doom
    rp/src
    rp/src/include
    rp/src/settings
    rp
    lib/xpad/src
; rp/src/CMakeLists.txt's definitions, and _DEBUG for the debug build's
; diagnostics (DPRINTF output shows with mdfw run -V).
defines =
    RELEASE_VERSION=MDFW_VERSION
    RELEASE_TYPE="emumd"
    RELEASE_DATE=__DATE__
    CURRENT_APP_UUID_KEY="44444444-4444-4444-8444-444444444444"
    _DEBUG=1
    DISPLAY_ATARIST
    BOARD_TYPE_PICO_W=1
    BOARD_TYPE_PICO=0
    BOARD_TYPE_CUSTOM16MB=0
    SHRINK_MOBJ=1
    DOOM_ONLY=1
    DOOM_SMALL=1
    DOOM_CONST=1
    SOUND_LOW_PASS=1
    NUM_SOUND_CHANNELS=8
    NO_USE_CHECKSUM=1
    NO_USE_RELOAD=1
    USE_SINGLE_IWAD=1
    NO_USE_WIPE=1
    NO_USE_JOYSTICK=1
    NO_USE_DEH=1
    NO_USE_MUSIC_PACKS=1
    USE_FLAT_MAX_256=1
    USE_MEMMAP_ONLY=1
    USE_LIGHTMAP_INDEXES=1
    USE_ERASE_FRAME=1
    NO_DRAW_MID=1
    NO_DRAW_TOP=1
    NO_DRAW_BOTTOM=1
    NO_DRAW_MASKED=1
    NO_DRAW_SKY=1
    NO_DRAW_SPRITES=1
    NO_DRAW_PSPRITES=1
    NO_VISPLANE_GUTS=1
    NO_VISPLANE_CACHES=1
    NO_DRAWSEGS=1
    NO_VISSPRITES=1
    NO_MASKED_FLOOR_CLIP=1
    PD_DRAW_COLUMNS=1
    PD_DRAW_MARKERS=1
    PD_DRAW_PLANES=1
    PD_SCALE_SORT=1
    PD_CLIP_WALLS=1
    PD_QUANTIZE=1
    PD_SANITY=1
    PD_COLUMNS=1
    PICO_DOOM=1
    NO_USE_DS_COLORMAP=1
    NO_USE_DC_COLORMAP=1
    USE_READONLY_MMAP=1
    NO_USE_TIMIDITY=1
    NO_USE_GUS=1
    NO_USE_LIBSAMPLERATE=1
    NO_USE_STATE_MISC=1
    USE_RAW_MAPNODE=1
    USE_RAW_MAPVERTEX=1
    USE_RAW_MAPSEG=1
    USE_RAW_MAPLINEDEF=1
    USE_RAW_MAPTHING=1
    USE_INDEX_LINEBUFFER=1
    NO_USE_ZLIGHT=1
    NO_Z_ZONE_ID=1
    Z_MALOOC_EXTRA_DATA=1
    USE_THINKER_POOL=1
    NO_INTERCEPTS_OVERRUN=1
    TEMP_IMMUTABLE_DISABLED=1
    USE_CONST_SFX=1
    USE_CONST_MUSIC=1
    NO_DEMO_RECORDING=1
    PICO_NO_TIMING_DEMO=1
    NO_USE_EXIT=1
    DOOM_TINY=1
    NO_RDRAW=1
    NO_USE_NET=1
    NO_FILE_ACCESS=1
    NO_USE_ARGS=1
    NO_USE_SAVE_CONFIG=1
    NO_USE_FLOAT=1
    USE_VANILLA_KEYBOARD_MAPPING_ONLY=1
    NO_USE_LOADING_DISK=1
    USE_WHD=1
    NO_Z_MALLOC_USER_PTR=1
    FIXED_SCREENWIDTH=1
    FLOOR_CEILING_CLIP_8BIT=1
    NO_SCREENSHOT=1
    NO_USE_BOUND_CONFIG=1
    USE_FPS=1
    USE_MEMORY_WAD=1
    NO_IERROR=0
    NO_ZONE_DEBUG=1
    NO_USE_ENDDOOM=1
    NO_USE_MOUSE=1
    NO_USE_LOAD=1
    NO_USE_SAVE=1
    WHD_SUPER_TINY=1
    DEMO1_ONLY=1
    NO_USE_FINALE_CAST=1
    NO_USE_FINALE_BUNNY=1
    PICODOOM_RENDER_NEWHOPE=1
    MERGE_DISTSCALE0_INTO_VIEWCOSSINANGLE=1
    MDDOOM=1
    MDDOOM_TEST_CARD=0
    MDDOOM_LEVEL_SELECT=0
; emu/shim/mddoom_emu.h goes first everywhere: see there for why.
cflags = -O2 -include mddoom_emu.h -Wno-unused-variable -Wno-unused-but-set-variable
    -Wno-unused-value -Wno-unknown-pragmas -Wno-unknown-warning-option -Wno-constant-conversion
cxxflags = -fno-exceptions -fno-rtti

[run]
; The SD card: the level packs go in emu/sd/doom (README.md, "Running it
; on your computer"). Give a TOS image with --tos, or make emu TOS=...
sd = emu/sd
machine = ste
